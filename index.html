<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>متاهة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
#menu{position:fixed;inset:0;z-index:100;background:#000 url('https://i.postimg.cc/0QQB9Fcy/free-backrooms-wallpaper-v0-65g3p16dkqg81.jpg') center/cover;display:flex;align-items:center;justify-content:center}
#mi{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;background:rgba(0,0,0,.6);border-radius:18px}
.btn{background:#a855f7;color:#fff;border:none;padding:14px 36px;font-size:17px;border-radius:10px;font-weight:bold;min-width:200px}
.btn.red{background:#d04060}
#ci{width:180px;padding:14px;font-size:26px;text-align:center;border-radius:10px;border:2px solid #6a4cba;letter-spacing:12px;background:#1a1030;color:#fff;outline:none;font-family:monospace}
#rc{font-size:48px;font-weight:bold;letter-spacing:14px;color:#e9d5ff;padding:16px 30px;background:rgba(26,16,48,.9);border:3px solid #a855f7;border-radius:14px;font-family:monospace}
#st{font-size:13px;color:#e0d0ff;text-align:center;max-width:90%}
#msg{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(168,85,247,.95);padding:10px 20px;border-radius:10px;font-size:16px;display:none;z-index:20;font-weight:bold;white-space:nowrap}
#role{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:6px 14px;border-radius:10px;font-size:13px;display:none;z-index:14;color:#ffcc44;font-weight:bold}
#hp{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:10px;font-size:14px;font-weight:bold;color:#ff6060;z-index:15;display:none}
#rmBadge{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(168,85,247,.9);padding:6px 16px;border-radius:10px;font-size:18px;font-weight:bold;font-family:monospace;letter-spacing:4px;z-index:15;display:none}
#coin{position:fixed;top:14px;right:14px;display:none;align-items:center;gap:8px;background:rgba(0,0,0,.7);padding:6px 16px 6px 6px;border-radius:25px;border:2px solid rgba(255,220,80,.6);z-index:18;font-size:20px;font-weight:bold;color:#fe4}
#coinImg{width:32px;height:32px;border-radius:50%;background:url('https://i.postimg.cc/cHM21qYD/IMG-20261008-153917-222.jpg') center/cover;border:2px solid rgba(255,220,80,.9)}
#rd{position:fixed;top:62px;right:14px;background:#fc0;color:#000;border:2px solid #fff;padding:6px 18px;border-radius:20px;font-weight:bold;font-size:13px;z-index:18;display:none}
#stick{position:fixed;left:20px;bottom:20px;width:150px;height:90px;border-radius:45px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.3);z-index:10;display:none}
#thumb{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:30px;background:#a855f7;opacity:.9}
#fire,#sp{position:fixed;right:20px;width:100px;height:100px;border-radius:50%;color:#fff;font-weight:bold;display:none;align-items:center;justify-content:center;z-index:10}
#fire{bottom:140px;background:radial-gradient(circle,#f06080,#a02040);border:2px solid #ff4060;font-size:18px}
#sp{bottom:20px;background:radial-gradient(circle,#60c0ff,#2060a0);border:2px solid #4090ff;font-size:16px}
#sp.on{background:radial-gradient(circle,#60ff90,#20a060);border-color:#40ff80}
#warn{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:3000}
#warn .box{background:#1a1a1a;border:2px solid #fc0;border-radius:14px;padding:24px;text-align:center;max-width:320px}
#warn p{font-size:16px;margin-bottom:20px;line-height:1.6}
#warn button{padding:10px 26px;border-radius:20px;border:2px solid #fff;font-weight:bold;font-size:15px;margin:0 6px}
#wy{background:#4CAF50;color:#fff}#wn{background:#f55;color:#fff}
</style>
</head>
<body>
<div id="menu"><div id="mi">
<button class="btn" id="cb">إنشاء (القاتل)</button>
<button class="btn" id="jb">انضمام (الهارب)</button>
<input id="ci" maxlength="3" placeholder="123" inputmode="numeric" style="display:none" autocomplete="off"/>
<button class="btn" id="jo" style="display:none">دخول</button>
<button class="btn red" id="rb" style="display:none">إعادة المحاولة</button>
<div id="rc" style="display:none"></div>
<div id="st">اختر: إنشاء أو انضمام</div>
</div></div>

<div id="msg"></div><div id="role"></div><div id="hp">❤️</div>
<div id="rmBadge"></div>
<div id="coin"><div id="coinImg"></div><span id="cv">0</span></div>
<button id="rd">🎁 استرداد</button>
<div id="warn"><div class="box">
<p>⚠️ سيتم خروجك من الغرفة<br/>هل تريد المتابعة؟</p>
<button id="wy">نعم</button><button id="wn">لا</button>
</div></div>
<div id="stick"><div id="thumb"></div></div><div id="fire">ضرب</div><div id="sp">جري</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.0/peerjs.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
if(typeof THREE==='undefined'||typeof Peer==='undefined'){$('#st').textContent='فشل التحميل';return}

var M=21,C=6,H=63,WH=7,maze=[];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(s){var r=rng(s|0);maze=[];
 for(var i=0;i<M;i++){maze[i]=[];for(var j=0;j<M;j++)maze[i][j]=1}
 var st=[[1,1]];maze[1][1]=0;var d=[[0,2],[0,-2],[2,0],[-2,0]];
 while(st.length){var c=st[st.length-1],ne=[];
  for(var k=0;k<4;k++){var nx=c[0]+d[k][0],ny=c[1]+d[k][1];if(nx>0&&nx<M-1&&ny>0&&ny<M-1&&maze[ny][nx])ne.push([nx,ny,d[k][0]/2,d[k][1]/2])}
  if(!ne.length){st.pop();continue}
  var p=ne[~~(r()*ne.length)];maze[c[1]+p[3]][c[0]+p[2]]=0;maze[p[1]][p[0]]=0;st.push([p[0],p[1]]);}
 for(var q=0;q<35;q++)maze[1+~~(r()*(M-2))][1+~~(r()*(M-2))]=0;
 maze[1][1]=0;maze[1][2]=0;maze[2][1]=0;
 maze[M-2][M-2]=0;maze[M-3][M-2]=0;
 maze[1][M-2]=0;maze[2][M-2]=0;
}
gen(1);
function cw(x,y){return{x:x*C-H+C/2,z:y*C-H+C/2}}
function isW(x,z){var a=~~((x+H)/C),b=~~((z+H)/C);return a<0||a>=M||b<0||b>=M||maze[b][a]===1}
function rSpot(ax,az,md){for(var t=0;t<80;t++){var cx=1+~~(Math.random()*(M-2)),cy=1+~~(Math.random()*(M-2));if(maze[cy][cx])continue;var w=cw(cx,cy);if(md&&Math.hypot(w.x-ax,w.z-az)<md)continue;return w}return cw(1,1)}

var P={x:0,z:0,yaw:0,pitch:0},code='',peer=null,conn=null,isHost=false,
 role=null,rp=null,last=0,prev=0,svX=0,svY=0,sid=null,lid=null,lx=0,ly=0,
 state='play',started=false,rMode='',scene,camera,renderer,holePos=null,
 seed=0,sprinting=false,coins=0,club=null,swT=0;

function initS(){
 try{renderer=new THREE.WebGLRenderer()}catch(e){$('#st').textContent='لا WebGL';return false}
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
 document.body.appendChild(renderer.domElement);
 scene=new THREE.Scene();scene.background=new THREE.Color(0);scene.fog=new THREE.Fog(0,18,75);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,250);scene.add(camera);
 scene.add(new THREE.AmbientLight(0xfff0c0,.55));
 var L=new THREE.TextureLoader();
 var wT=L.load('https://i.postimg.cc/0QQB9Fcy/free-backrooms-wallpaper-v0-65g3p16dkqg81.jpg');
 wT.wrapS=wT.wrapT=THREE.RepeatWrapping;wT.repeat.set(1,1);
 var wM=new THREE.MeshLambertMaterial({map:wT});
 var fT=L.load('https://i.postimg.cc/fb6JvBJ4/Carpet0034-1-350.jpg');
 fT.wrapS=fT.wrapT=THREE.RepeatWrapping;fT.repeat.set(M,M);
 var gnd=new THREE.Mesh(new THREE.PlaneGeometry(M*C,M*C),new THREE.MeshLambertMaterial({map:fT}));
 gnd.rotation.x=-Math.PI/2;scene.add(gnd);
 var cl=new THREE.Mesh(new THREE.PlaneGeometry(M*C,M*C),new THREE.MeshLambertMaterial({color:0xfaffbf}));
 cl.rotation.x=Math.PI/2;cl.position.y=WH;scene.add(cl);
 for(var y=0;y<M;y++)for(var x=0;x<M;x++){
  var w=cw(x,y);
  if(maze[y][x]===1){var bx=new THREE.Mesh(new THREE.BoxGeometry(C,WH,C),wM);bx.position.set(w.x,WH/2,w.z);scene.add(bx)}
  if(x%6===3&&y%6===3){var pl=new THREE.PointLight(0xffe090,1.2,35,1.6);pl.position.set(w.x,WH-1,w.z);scene.add(pl)}}
 holePos=cw(M-2,M-2);
 var hole=new THREE.Mesh(new THREE.CircleGeometry(1.6,20),new THREE.MeshBasicMaterial({color:0}));
 hole.rotation.x=-Math.PI/2;hole.position.set(holePos.x,.05,holePos.z);scene.add(hole);
 var hr=new THREE.Mesh(new THREE.RingGeometry(1.6,2,20),new THREE.MeshBasicMaterial({color:0xa855f7,side:THREE.DoubleSide}));
 hr.rotation.x=-Math.PI/2;hr.position.set(holePos.x,.06,holePos.z);scene.add(hr);
 var cg=new THREE.Group();
 var cyl=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.2,8),new THREE.MeshLambertMaterial({color:0x6a4a2a,depthTest:false}));
 cyl.position.y=.6;cyl.renderOrder=999;cg.add(cyl);
 cg.position.set(.5,-.5,-.5);cg.rotation.y=.15;cg.visible=false;
 club=cg;camera.add(cg);
 return true;
}
function mkP(size){
 var g=new THREE.Group();
 var sk=new THREE.MeshLambertMaterial({color:0xf5cd30}),bd=new THREE.MeshLambertMaterial({color:0x2f6fe0});
 var lg=new THREE.MeshLambertMaterial({color:0x3fbf3f}),em=new THREE.MeshBasicMaterial({color:0});
 function b(w,h,d,m,x,y,z){var o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);g.add(o)}
 b(.88,1.08,.42,lg,0,.54,0);b(.88,.9,.46,bd,0,1.53,0);b(.4,.9,.42,sk,-.64,1.53,0);
 b(.4,.9,.42,sk,.64,1.53,0);b(.56,.52,.56,sk,0,2.24,0);
 b(.08,.08,.02,em,-.12,2.28,.29);b(.08,.08,.02,em,.12,2.28,.29);
 g.scale.set(size,size,size);return g;
}
function sM(t){var c=$('#msg');if(c._v===t)return;c._v=t;c.textContent=t;c.style.display=t?'block':'none'}
function sR(t){var c=$('#role');c.textContent=t;c.style.display=t?'block':'none'}
function gc(){var s='';for(var i=0;i<3;i++)s+=~~(Math.random()*10);return s}
function sRt(m,md){$('#st').textContent=m;rMode=md;$('#rb').style.display='block'}

function addCoin(v){coins+=v;$('#cv').textContent=coins%1===0?coins:coins.toFixed(1);
 $('#rd').style.display=coins>=.5?'block':'none';sM('+'+v+' 🪙');setTimeout(function(){sM('')},900)}

$('#rd').onclick=function(){if(coins<.5)return;$('#warn').style.display='flex'};
$('#wn').onclick=function(){$('#warn').style.display='none'};
$('#wy').onclick=function(){window.location.href='https://hesoyam14moh-dot.github.io/coun/'};

var PC={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}};
function mP(id){try{return id?new Peer(id,PC):new Peer(PC)}catch(e){return null}}

function createR(att){
 att=att||0;if(att>=6){sRt('السيرفر مزحوم','create');return}
 code=gc();seed=~~(Math.random()*1e9);gen(seed);
 $('#rc').textContent=code;$('#rc').style.display='block';
 $('#st').textContent='جاري الاتصال... ('+(att+1)+'/6)';
 if(peer)try{peer.destroy()}catch(e){}
 peer=mP('wmgz'+code);
 if(!peer){setTimeout(function(){createR(att+1)},1200);return}
 var op=false;
 peer.on('open',function(){op=true;isHost=true;role='hunter';
  $('#cb').style.display='none';$('#jb').style.display='none';
  $('#st').textContent='✓ أعط الرمز لصاحبك';$('#rb').style.display='none';startG()});
 peer.on('connection',function(c){conn=c;
  c.on('open',function(){conn.send({t:'r',role:'runner',seed:seed});
   sR('أنت القاتل 🔫');$('#fire').style.display='flex';$('#coin').style.display='flex';
   sM('صاحبك وصل! 👥');setTimeout(function(){sM('')},2000)});
  c.on('data',onD);
  c.on('close',function(){conn=null;rp=null;sM('انقطع الاتصال')})});
 peer.on('error',function(e){if(op)return;var t=e&&e.type;
  if(t==='server-error'||t==='network'||t==='socket-error'||t==='unavailable-id')setTimeout(function(){createR(att+1)},1000);
  else sRt('خطأ: '+t,'create')});
 setTimeout(function(){if(!op&&att<6){try{peer.destroy()}catch(e){}createR(att+1)}},7000);
}

function joinR(att){
 att=att||0;if(att>=6){sRt('ما لقيت الغرفة','join');return}
 $('#st').textContent='جاري الاتصال... ('+(att+1)+'/6)';
 if(peer)try{peer.destroy()}catch(e){}
 peer=mP(null);
 if(!peer){setTimeout(function(){joinR(att+1)},1200);return}
 var con=false;
 peer.on('open',function(){
  conn=peer.connect('wmgz'+code,{reliable:true});
  conn.on('open',function(){con=true;isHost=false;
   $('#jb').style.display='none';$('#jo').style.display='none';$('#ci').style.display='none';
   $('#st').textContent='متصل!'});
  conn.on('data',onD);
  conn.on('close',function(){conn=null;rp=null;sM('انقطع الاتصال')})});
 peer.on('error',function(e){if(con)return;var t=e&&e.type;
  if(t==='peer-unavailable')setTimeout(function(){joinR(att+1)},1500);
  else if(t==='server-error'||t==='network'||t==='socket-error')setTimeout(function(){joinR(att+1)},1000);
  else sRt('خطأ: '+t,'join')});
 setTimeout(function(){if(!con&&att<6){try{peer.destroy()}catch(e){}joinR(att+1)}},8000);
}

function respawn(){
 var sp=rSpot(rp?rp.x:P.x,rp?rp.z:P.z,15);
 P.x=sp.x;P.z=sp.z;
 if(conn&&conn.open)conn.send({t:'rs',x:P.x,z:P.z});
}

function onD(d){
 if(!d||!d.t)return;
 if(d.t==='s'){
  if(!started||!scene)return;
  if(!rp){
   var sz=(role==='hunter')?0.65:1.05;
   var g=mkP(sz);g.position.set(d.x,0,d.z);scene.add(g);
   rp={x:d.x,z:d.z,yaw:0,mesh:g};
  }
  rp.x=d.x;rp.z=d.z;
  if(typeof d.yaw==='number')rp.yaw=d.yaw;
 } else if(d.t==='rs'&&rp){rp.x=d.x;rp.z=d.z}
 else if(d.t==='r'){role=d.role;if(d.seed!==undefined)gen(d.seed);
  if(!started){startG();sM('متصل ✓');setTimeout(function(){sM('')},1500)}
  if(role==='hunter'){$('#fire').style.display='flex';$('#hp').style.display='none';sR('أنت القاتل 🔫')}
  else{$('#hp').style.display='block';sR('أنت الهارب 🏃 — قلب واحد! 💛')}
  $('#coin').style.display='flex'}
 else if(d.t==='hit'){state='over';sM('مُت! 💀');
  if(navigator.vibrate)navigator.vibrate([100,50,100,50,100]);
  setTimeout(function(){state='play';sM('');respawn()},2500)}
 else if(d.t==='w'){state='over';sM('صاحبك هرب! 🏃');setTimeout(function(){state='play';sM('');respawn()},3000)}
}

function shoot(){
 if(state!=='play'||role!=='hunter'||!rp)return;
 swT=.3;if(navigator.vibrate)navigator.vibrate(20);
 if(Math.hypot(rp.x-P.x,rp.z-P.z)<2.6){
  if(conn&&conn.open)conn.send({t:'hit'});
  state='over';sM('قتلته! 🎉 +4🪙');addCoin(4);
  setTimeout(function(){state='play';sM('');respawn()},2500)}
}

var SB=$('#stick'),ST=$('#thumb'),spB=$('#sp');
function setSt(t){
 var r=SB.getBoundingClientRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
 var d=Math.hypot(dx,dy),mR=48;if(d>mR){dx=dx/d*mR;dy=dy/d*mR}
 ST.style.transform='translate('+dx+'px,'+dy+'px)';svX=dx/mR;svY=dy/mR;
}
document.addEventListener('touchstart',function(e){
 for(var i=0;i<e.changedTouches.length;i++){
  var t=e.changedTouches[i],el=document.elementFromPoint(t.clientX,t.clientY);
  if(!el)continue;
  if(el.id==='sp'||el.parentNode.id==='sp'){e.preventDefault();sprinting=!sprinting;spB.classList.toggle('on',sprinting);continue}
  if(el.id==='rd'||el.closest('#warn'))continue;
  if(el.id==='stick'||el.parentNode.id==='stick'){if(!sid){sid=t.identifier;setSt(t)}}
  else if(el.id==='fire')shoot();
  else if(!lid&&started){lid=t.identifier;lx=t.clientX;ly=t.clientY}}
},{passive:false});
document.addEventListener('touchmove',function(e){
 for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
  if(t.identifier===sid)setSt(t);
  else if(t.identifier===lid){P.yaw-=(t.clientX-lx)*.005;
   P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-(t.clientY-ly)*.004));
   lx=t.clientX;ly=t.clientY}}
},{passive:true});
function endT(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
 if(t.identifier===sid){sid=null;svX=0;svY=0;ST.style.transform='translate(0,0)'}
 if(t.identifier===lid)lid=null}}
document.addEventListener('touchend',endT,{passive:true});
document.addEventListener('touchcancel',endT,{passive:true});
spB.addEventListener('mousedown',function(e){e.preventDefault();sprinting=!sprinting;spB.classList.toggle('on',sprinting)});
var keys={};
document.addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='Space')shoot()});
document.addEventListener('keyup',function(e){keys[e.code]=false});
addEventListener('resize',function(){if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

$('#cb').onclick=function(){$('#cb').disabled=true;$('#jb').disabled=true;createR(0)};
$('#jb').onclick=function(){$('#cb').style.display='none';$('#jb').style.display='none';
 $('#ci').style.display='block';$('#jo').style.display='block';$('#ci').focus();$('#st').textContent='اكتب الرمز'};
$('#jo').onclick=function(){var v=$('#ci').value.replace(/\D/g,'');
 if(v.length!==3){$('#ci').style.borderColor='#ff4060';return}
 code=v;$('#jo').disabled=true;joinR(0)};
$('#rb').onclick=function(){$('#rb').style.display='none';
 if(rMode==='create'){$('#cb').style.display='block';$('#cb').disabled=false;
  $('#jb').style.display='block';$('#jb').disabled=false;$('#rc').style.display='none';$('#st').textContent='اختر'}
 else{$('#jo').style.display='block';$('#jo').disabled=false;$('#st').textContent='حاول'}};
$('#ci').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,3)});

function startG(){
 if(started)return;if(!initS())return;started=true;
 var s0=isHost?cw(1,1):cw(M-2,1);P.x=s0.x;P.z=s0.z;
 $('#menu').style.display='none';$('#stick').style.display='block';
 $('#sp').style.display='flex';
 $('#rmBadge').textContent='#'+code;$('#rmBadge').style.display='block';
 if(isHost){role='hunter';sR('استنى صاحبك')}
 prev=performance.now();loop();
}

function loop(){
 requestAnimationFrame(loop);
 var now=performance.now(),dt=(now-prev)/1000;prev=now;if(dt>.05)dt=.05;
 if(state==='play'){
  var mf=-svY,ms=svX;
  if(keys['KeyW'])mf+=1;if(keys['KeyS'])mf-=1;if(keys['KeyD'])ms+=1;if(keys['KeyA'])ms-=1;
  var dx=Math.sin(P.yaw)*mf-Math.cos(P.yaw)*ms,dz=Math.cos(P.yaw)*mf+Math.sin(P.yaw)*ms;
  var L=Math.hypot(dx,dz);
  if(L>.01){
   var sp=5*(sprinting?2.5:1)*Math.min(L,1),nx=P.x+dx/L*sp*dt,nz=P.z+dz/L*sp*dt;
   if(!isW(nx,P.z))P.x=nx;if(!isW(P.x,nz))P.z=nz}
  if(role==='runner'&&holePos&&Math.hypot(P.x-holePos.x,P.z-holePos.z)<1.5){
   state='over';sM('فزت! 🎉 +4🪙');addCoin(4);
   if(conn&&conn.open)conn.send({t:'w',r:'hole'});
   setTimeout(function(){state='play';sM('');respawn()},3000)}
 }
 var cp=Math.cos(P.pitch);
 camera.position.set(P.x,1.6,P.z);
 camera.lookAt(P.x+Math.sin(P.yaw)*cp*10,1.6+Math.sin(P.pitch)*10,P.z+Math.cos(P.yaw)*cp*10);
 if(club){club.visible=(role==='hunter');
  if(swT>0){swT-=dt;club.rotation.x=Math.sin((1-swT/.3)*Math.PI)*1.2}else club.rotation.x=0}
 if(rp&&rp.mesh){
  rp.mesh.position.x+=(rp.x-rp.mesh.position.x)*.4;
  rp.mesh.position.z+=(rp.z-rp.mesh.position.z)*.4;
  rp.mesh.position.y=0;
  var dy=rp.yaw-rp.mesh.rotation.y;
  while(dy>Math.PI)dy-=Math.PI*2;
  while(dy<-Math.PI)dy+=Math.PI*2;
  rp.mesh.rotation.y+=dy*.4;
 }
 if(conn&&conn.open&&now-last>40){last=now;conn.send({t:'s',x:P.x,z:P.z,yaw:P.yaw})}
 renderer.render(scene,camera);
}
})();
